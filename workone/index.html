<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Full Body Dumbbell Workout</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at center, #153a70 0%, #07182e 48%, #02060c 100%);
    }

    button {
      font: inherit;
    }

    .workout-app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP INFORMATION BAR
       ========================= */

    .top-bar {
      min-height: 100px;
      padding: 16px 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.78);
      border-bottom: 4px solid #1268d8;
    }

    .workout-title {
      font-size: clamp(22px, 2.4vw, 42px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .workout-title span {
      color: #ffd400;
    }

    .round-display {
      text-align: center;
      font-size: clamp(17px, 1.5vw, 25px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .round-display strong {
      color: #ffd400;
    }

    .exercise-counter {
      text-align: right;
      font-size: clamp(17px, 1.5vw, 25px);
      font-weight: 800;
    }

    /* =========================
       PROGRESS BAR
       ========================= */

    .progress-container {
      width: 100%;
      height: 10px;
      background: #172235;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ffd400;
      transition: width 0.3s linear;
    }

    /* =========================
       MAIN SLIDE
       ========================= */

    .slide {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .exercise-card {
      position: relative;
      width: min(1200px, 94vw);
      height: min(650px, 72vh);
      padding: 35px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 35px;
      align-items: center;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.035)
        );
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 35px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 50px rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }

    .exercise-card::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -210px;
      right: -170px;
      border-radius: 50%;
      background: rgba(18, 104, 216, 0.22);
    }

    /* =========================
       EXERCISE INFORMATION
       ========================= */

    .exercise-info {
      position: relative;
      z-index: 2;
    }

    .section-label {
      display: inline-block;
      margin-bottom: 22px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #1268d8;
      font-size: clamp(16px, 1.7vw, 25px);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .exercise-number {
      margin-bottom: 8px;
      color: #ffd400;
      font-size: clamp(26px, 3vw, 48px);
      font-weight: 900;
    }

    .exercise-name {
      max-width: 760px;
      font-size: clamp(44px, 7vw, 105px);
      line-height: 0.96;
      font-weight: 900;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .exercise-instruction {
      margin-top: 25px;
      max-width: 700px;
      color: #d8e7fa;
      font-size: clamp(18px, 1.8vw, 28px);
      line-height: 1.35;
    }

    /* =========================
       TIMER CIRCLE
       ========================= */

    .timer-area {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .timer-circle {
      width: min(330px, 28vw);
      height: min(330px, 28vw);
      min-width: 230px;
      min-height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 16px solid #ffd400;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      box-shadow:
        0 0 45px rgba(255, 212, 0, 0.25),
        inset 0 0 35px rgba(0, 0, 0, 0.45);
    }

    .timer-status {
      margin-bottom: 4px;
      color: #ffd400;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .timer-number {
      font-size: clamp(78px, 10vw, 145px);
      line-height: 0.9;
      font-weight: 900;
    }

    .timer-unit {
      margin-top: 8px;
      color: #c9d9ef;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .next-exercise {
      margin-top: 22px;
      min-height: 60px;
      font-size: clamp(16px, 1.5vw, 24px);
      line-height: 1.35;
    }

    .next-exercise span {
      color: #ffd400;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* =========================
       REST MODE
       ========================= */

    body.rest-mode {
      background:
        radial-gradient(circle at center, #23467c 0%, #102443 48%, #040b15 100%);
    }

    body.rest-mode .timer-circle {
      border-color: #47c8ff;
      box-shadow:
        0 0 45px rgba(71, 200, 255, 0.3),
        inset 0 0 35px rgba(0, 0, 0, 0.45);
    }

    body.rest-mode .timer-status {
      color: #47c8ff;
    }

    body.rest-mode .progress-bar {
      background: #47c8ff;
    }

    /* =========================
       CONTROLS
       ========================= */

    .controls {
      min-height: 94px;
      padding: 13px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.82);
      border-top: 2px solid rgba(255, 255, 255, 0.12);
    }

    .control-button {
      min-width: 130px;
      padding: 14px 21px;
      color: white;
      background: #1268d8;
      border: 0;
      border-radius: 13px;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 0.2s,
        background 0.2s;
    }

    .control-button:hover {
      transform: translateY(-2px);
      background: #2680f2;
    }

    .control-button.start-button {
      min-width: 170px;
      color: #07182e;
      background: #ffd400;
    }

    .control-button.start-button:hover {
      background: #ffe34f;
    }

    .sound-button {
      min-width: 70px;
    }

    /* =========================
       FINISHED SCREEN
       ========================= */

    .finished-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 30px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background:
        radial-gradient(circle, #184e91 0%, #061529 55%, #010306 100%);
    }

    .finished-screen.active {
      display: flex;
    }

    .finished-screen h2 {
      color: #ffd400;
      font-size: clamp(55px, 10vw, 145px);
      line-height: 0.95;
      text-transform: uppercase;
    }

    .finished-screen p {
      margin: 25px 0 35px;
      font-size: clamp(23px, 3vw, 42px);
      font-weight: 700;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 850px) {
      body {
        overflow: auto;
      }

      .top-bar {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .exercise-counter {
        text-align: center;
      }

      .exercise-card {
        height: auto;
        min-height: 680px;
        grid-template-columns: 1fr;
        text-align: center;
      }

      .exercise-info {
        display: flex;
        align-items: center;
        flex-direction: column;
      }

      .timer-circle {
        width: 230px;
        height: 230px;
      }

      .controls {
        flex-wrap: wrap;
      }

      .control-button {
        min-width: 110px;
      }
    }
  </style>
</head>

<body>

  <main class="workout-app">

    <header class="top-bar">
      <h1 class="workout-title">
        Full Body Dumbbell <span>HIIT</span>
      </h1>

      <div class="round-display">
        Round <strong id="roundNumber">1</strong> of
        <strong id="totalRounds">2</strong>
      </div>

      <div class="exercise-counter" id="exerciseCounter">
        Exercise 1 of 22
      </div>
    </header>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="slide">

      <article class="exercise-card">

        <div class="exercise-info">
          <div class="section-label" id="sectionLabel">
            Standing Exercise
          </div>

          <div class="exercise-number" id="exerciseNumber">
            Exercise 1
          </div>

          <h2 class="exercise-name" id="exerciseName">
            Dumbbell High Pull
          </h2>

          <p class="exercise-instruction" id="exerciseInstruction">
            Pull the dumbbells upward while keeping your chest tall and
            controlling the movement.
          </p>
        </div>

        <div class="timer-area">
          <div class="timer-circle">
            <div class="timer-status" id="timerStatus">Ready</div>
            <div class="timer-number" id="timerNumber">30</div>
            <div class="timer-unit">seconds</div>
          </div>

          <div class="next-exercise" id="nextExercise">
            Next: <span>Dumbbell Thrusters</span>
          </div>
        </div>

      </article>

    </section>

    <footer class="controls">
      <button class="control-button" id="previousButton">
        Previous
      </button>

      <button class="control-button start-button" id="startButton">
        Start Workout
      </button>

      <button class="control-button" id="nextButton">
        Next
      </button>

      <button class="control-button" id="resetButton">
        Reset
      </button>

      <button
        class="control-button sound-button"
        id="soundButton"
        aria-label="Toggle sound"
      >
        🔊
      </button>
    </footer>

  </main>

  <section class="finished-screen" id="finishedScreen">
    <h2>Workout Complete!</h2>
    <p>You completed both rounds.</p>

    <button class="control-button start-button" id="restartButton">
      Restart Workout
    </button>
  </section>

  <script>
    /* =========================
       WORKOUT EXERCISES
       ========================= */

    const exercises = [
      {
        name: "Dumbbell High Pull",
        section: "Standing Exercise",
        instruction:
          "Pull the dumbbells upward toward your chest. Keep your elbows high and control the lowering phase."
      },
      {
        name: "Dumbbell Thrusters",
        section: "Standing Exercise",
        instruction:
          "Squat with the dumbbells at shoulder height, then stand and press them overhead."
      },
      {
        name: "Romanian Deadlift",
        section: "Standing Exercise",
        instruction:
          "Push your hips backward, keep your back neutral and lower the dumbbells close to your legs."
      },
      {
        name: "Lateral Raise",
        section: "Standing Exercise",
        instruction:
          "Raise the dumbbells out to the sides until approximately shoulder height. Use a light weight."
      },
      {
        name: "Reverse Lunge",
        section: "Standing Exercise",
        instruction:
          "Step backward into a lunge, lower under control and alternate legs."
      },
      {
        name: "High Knees",
        section: "Standing HIIT",
        instruction:
          "Run in place while lifting your knees. Move quickly while maintaining an upright posture."
      },
      {
        name: "Supported One-Arm Row",
        section: "Standing Exercise",
        instruction:
          "Place one hand on a desk, pull the dumbbell toward your hip and switch arms halfway."
      },
      {
        name: "Russian Twists",
        section: "Floor and Core",
        instruction:
          "Sit with your torso leaned slightly backward and rotate from side to side under control."
      },
      {
        name: "Bicycle Abs",
        section: "Floor and Core",
        instruction:
          "Alternate bringing each elbow toward the opposite knee without pulling on your neck."
      },
      {
        name: "Tuck-Up",
        section: "Floor and Core",
        instruction:
          "Bring your knees and chest toward each other, then extend without letting your lower back arch."
      },
      {
        name: "Dumbbell Toe-Touch Crunch",
        section: "Floor and Core",
        instruction:
          "Hold one dumbbell above your chest and reach upward toward your raised feet."
      },
      {
        name: "Hollow Hold",
        section: "Floor and Core",
        instruction:
          "Press your lower back into the floor while holding your shoulders and legs slightly elevated."
      },
      {
        name: "Mountain Climbers",
        section: "Floor HIIT",
        instruction:
          "From a high-plank position, drive your knees forward alternately at a controlled, quick pace."
      },
      {
        name: "Heel Touches",
        section: "Floor and Core",
        instruction:
          "Keep your shoulders slightly raised and reach from side to side toward each heel."
      },
      {
        name: "Chest Flys",
        section: "Floor Strength",
        instruction:
          "Lower the dumbbells outward with softly bent elbows, then squeeze them together above your chest."
      },
      {
        name: "Side Plank",
        section: "Floor and Core",
        instruction:
          "Keep your body in a straight line. Switch sides halfway through the exercise."
      },
      {
        name: "Chest Press",
        section: "Floor Strength",
        instruction:
          "Press the dumbbells above your chest, then lower them slowly until your upper arms touch the floor."
      },
      {
        name: "Plank",
        section: "Floor and Core",
        instruction:
          "Brace your abdomen and maintain a straight line from your head through your heels."
      },
      {
        name: "Renegade Row",
        section: "Floor Strength",
        instruction:
          "From a stable plank, row one dumbbell at a time while limiting movement through your hips."
      },
      {
        name: "Overhead Sit-Up",
        section: "Floor and Core",
        instruction:
          "Hold a light dumbbell overhead and sit up with control. Avoid pulling your neck forward."
      },
      {
        name: "Goblet Squat",
        section: "Bonus Strength",
        instruction:
          "Hold one dumbbell at your chest, sit your hips down and stand by pushing through your feet."
      },
      {
        name: "Dumbbell Shoulder Press",
        section: "Bonus Strength",
        instruction:
          "Start with the dumbbells at shoulder height and press overhead without arching your lower back."
      }
    ];

    /* =========================
       SETTINGS
       ========================= */

    const workDuration = 30;
    const restDuration = 15;
    const totalRounds = 2;

    /* =========================
       STATE
       ========================= */

    let currentExerciseIndex = 0;
    let currentRound = 1;
    let timeRemaining = workDuration;
    let isRunning = false;
    let isResting = false;
    let timerInterval = null;
    let soundEnabled = true;

    /* =========================
       ELEMENTS
       ========================= */

    const exerciseName = document.getElementById("exerciseName");
    const exerciseNumber = document.getElementById("exerciseNumber");
    const exerciseInstruction =
      document.getElementById("exerciseInstruction");
    const sectionLabel = document.getElementById("sectionLabel");
    const exerciseCounter = document.getElementById("exerciseCounter");
    const roundNumber = document.getElementById("roundNumber");
    const timerStatus = document.getElementById("timerStatus");
    const timerNumber = document.getElementById("timerNumber");
    const nextExercise = document.getElementById("nextExercise");
    const progressBar = document.getElementById("progressBar");

    const startButton = document.getElementById("startButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const resetButton = document.getElementById("resetButton");
    const soundButton = document.getElementById("soundButton");
    const restartButton = document.getElementById("restartButton");
    const finishedScreen = document.getElementById("finishedScreen");

    document.getElementById("totalRounds").textContent = totalRounds;

    /* =========================
       DISPLAY EXERCISE
       ========================= */

    function displayExercise() {
      const exercise = exercises[currentExerciseIndex];

      exerciseName.textContent = exercise.name;
      exerciseNumber.textContent =
        `Exercise ${currentExerciseIndex + 1}`;

      exerciseInstruction.textContent = exercise.instruction;
      sectionLabel.textContent = exercise.section;

      exerciseCounter.textContent =
        `Exercise ${currentExerciseIndex + 1} of ${exercises.length}`;

      roundNumber.textContent = currentRound;

      const upcomingIndex =
        currentExerciseIndex + 1 < exercises.length
          ? currentExerciseIndex + 1
          : 0;

      const nextRound =
        currentExerciseIndex === exercises.length - 1 &&
        currentRound < totalRounds;

      if (
        currentExerciseIndex === exercises.length - 1 &&
        currentRound === totalRounds
      ) {
        nextExercise.innerHTML =
          `Next: <span>Workout Complete</span>`;
      } else if (nextRound) {
        nextExercise.innerHTML =
          `Next: <span>Round ${currentRound + 1} — ${exercises[0].name}</span>`;
      } else {
        nextExercise.innerHTML =
          `Next: <span>${exercises[upcomingIndex].name}</span>`;
      }

      updateProgress();
    }

    /* =========================
       TIMER
       ========================= */

    function toggleWorkout() {
      if (isRunning) {
        pauseWorkout();
      } else {
        startWorkout();
      }
    }

    function startWorkout() {
      if (timerInterval) {
        clearInterval(timerInterval);
      }

      isRunning = true;
      startButton.textContent = "Pause";

      if (!isResting) {
        timerStatus.textContent = "Work";
      }

      timerInterval = setInterval(() => {
        timeRemaining--;
        timerNumber.textContent = timeRemaining;

        if (timeRemaining <= 3 && timeRemaining > 0) {
          playBeep(550, 0.09);
        }

        if (timeRemaining <= 0) {
          if (isResting) {
            finishRest();
          } else {
            startRest();
          }
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      timerInterval = null;
      startButton.textContent = "Resume";
      timerStatus.textContent = "Paused";
    }

    function startRest() {
      isResting = true;
      timeRemaining = restDuration;

      document.body.classList.add("rest-mode");

      timerStatus.textContent = "Rest";
      timerNumber.textContent = timeRemaining;

      playBeep(850, 0.2);
    }

    function finishRest() {
      isResting = false;
      document.body.classList.remove("rest-mode");

      moveToNextExercise(true);
    }

    /* =========================
       NAVIGATION
       ========================= */

    function moveToNextExercise(fromTimer = false) {
      if (currentExerciseIndex < exercises.length - 1) {
        currentExerciseIndex++;
      } else if (currentRound < totalRounds) {
        currentRound++;
        currentExerciseIndex = 0;
      } else {
        finishWorkout();
        return;
      }

      timeRemaining = workDuration;
      timerNumber.textContent = timeRemaining;
      timerStatus.textContent = fromTimer && isRunning ? "Work" : "Ready";

      displayExercise();
      playBeep(1050, 0.2);
    }

    function moveToPreviousExercise() {
      if (currentExerciseIndex > 0) {
        currentExerciseIndex--;
      } else if (currentRound > 1) {
        currentRound--;
        currentExerciseIndex = exercises.length - 1;
      }

      isResting = false;
      timeRemaining = workDuration;

      document.body.classList.remove("rest-mode");

      timerNumber.textContent = timeRemaining;
      timerStatus.textContent = isRunning ? "Work" : "Ready";

      displayExercise();
    }

    function manuallyMoveNext() {
      isResting = false;
      document.body.classList.remove("rest-mode");
      moveToNextExercise(false);
    }

    /* =========================
       RESET AND FINISH
       ========================= */

    function resetWorkout() {
      clearInterval(timerInterval);
      timerInterval = null;

      currentExerciseIndex = 0;
      currentRound = 1;
      timeRemaining = workDuration;
      isRunning = false;
      isResting = false;

      document.body.classList.remove("rest-mode");

      timerNumber.textContent = timeRemaining;
      timerStatus.textContent = "Ready";
      startButton.textContent = "Start Workout";

      finishedScreen.classList.remove("active");

      displayExercise();
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      timerInterval = null;

      isRunning = false;
      isResting = false;

      document.body.classList.remove("rest-mode");
      finishedScreen.classList.add("active");

      playBeep(1200, 0.5);
    }

    /* =========================
       PROGRESS
       ========================= */

    function updateProgress() {
      const completedExercises =
        (currentRound - 1) * exercises.length +
        currentExerciseIndex;

      const totalExerciseCount =
        exercises.length * totalRounds;

      const percentage =
        (completedExercises / totalExerciseCount) * 100;

      progressBar.style.width = `${percentage}%`;
    }

    /* =========================
       SOUND
       ========================= */

    function playBeep(frequency = 700, duration = 0.12) {
      if (!soundEnabled) {
        return;
      }

      const AudioContext =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      const audioContext = new AudioContext();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = frequency;
      oscillator.type = "sine";

      gainNode.gain.setValueAtTime(
        0.16,
        audioContext.currentTime
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
      );

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundButton.textContent = soundEnabled ? "🔊" : "🔇";
    }

    /* =========================
       BUTTON EVENTS
       ========================= */

    startButton.addEventListener("click", toggleWorkout);
    nextButton.addEventListener("click", manuallyMoveNext);
    previousButton.addEventListener("click", moveToPreviousExercise);
    resetButton.addEventListener("click", resetWorkout);
    restartButton.addEventListener("click", resetWorkout);
    soundButton.addEventListener("click", toggleSound);

    /* Keyboard controls:
       Space = play/pause
       Right arrow = next
       Left arrow = previous
       R = reset
    */

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (event.code === "Space") {
        event.preventDefault();
        toggleWorkout();
      }

      if (event.key === "ArrowRight") {
        manuallyMoveNext();
      }

      if (event.key === "ArrowLeft") {
        moveToPreviousExercise();
      }

      if (key === "r") {
        resetWorkout();
      }
    });

    displayExercise();
  </script>

</body>
</html>
